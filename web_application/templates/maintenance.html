{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Maintenance Management</h2>
    <div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addRequestModal">
            <i class="bi bi-plus-circle"></i> New Request
        </button>
    </div>
</div>

<!-- Maintenance Requests Table -->
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Maintenance Requests</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Request ID</th>
                        <th>Equipment</th>
                        <th>Issue</th>
                        <th>Priority</th>
                        <th>Reported By</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="maintenanceTableBody">
                    <tr>
                        <td colspan="7" class="text-center">Loading maintenance requests...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Maintenance Request Modal -->
<div class="modal fade" id="addRequestModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Maintenance Request</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="maintenanceForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Request ID *</label>
                            <input type="text" class="form-control" name="request_id" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Equipment Name</label>
                            <input type="text" class="form-control" name="equipment_name">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Issue Description *</label>
                        <textarea class="form-control" name="issue_description" rows="3" required></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Priority</label>
                            <select class="form-select" name="priority">
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                                <option value="Critical">Critical</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Reported By</label>
                            <input type="text" class="form-control" name="reported_by">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Assigned To</label>
                            <input type="text" class="form-control" name="assigned_to">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Reported Date</label>
                        <input type="date" class="form-control" name="reported_date">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveMaintenanceRequest()">Save Request</button>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadMaintenanceRequests() {
        const requests = await apiCall('/api/maintenance/requests');
        
        if (requests.success !== false) {
            renderMaintenanceTable(requests);
        } else {
            document.getElementById('maintenanceTableBody').innerHTML = 
                '<tr><td colspan="7" class="text-center text-danger">Failed to load maintenance requests</td></tr>';
        }
    }

    function renderMaintenanceTable(requests) {
        const tbody = document.getElementById('maintenanceTableBody');
        
        if (requests.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">No maintenance requests found</td></tr>';
            return;
        }
        
        tbody.innerHTML = requests.map(request => `
            <tr>
                <td><strong>${request.request_id}</strong></td>
                <td>${request.equipment_name}</td>
                <td>${request.issue_description}</td>
                <td><span class="badge bg-${getPriorityColor(request.priority)}">${request.priority}</span></td>
                <td>${request.reported_by}</td>
                <td><span class="badge bg-${request.status === 'Completed' ? 'success' : 'warning'}">${request.status}</span></td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="editMaintenanceRequest(${request.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteMaintenanceRequest(${request.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function getPriorityColor(priority) {
        const colors = {
            'Low': 'secondary',
            'Medium': 'info',
            'High': 'warning',
            'Critical': 'danger'
        };
        return colors[priority] || 'secondary';
    }

    async function saveMaintenanceRequest() {
        const form = document.getElementById('maintenanceForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        const result = await apiCall('/api/maintenance/requests', 'POST', data);
        
        if (result.success) {
            showNotification('Maintenance request added successfully');
            $('#addRequestModal').modal('hide');
            form.reset();
            loadMaintenanceRequests();
        } else {
            showNotification('Failed to add request: ' + result.error, 'danger');
        }
    }

    document.addEventListener('DOMContentLoaded', loadMaintenanceRequests);
</script>
{% endblock %}

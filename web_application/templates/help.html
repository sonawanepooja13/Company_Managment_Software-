{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Help Desk</h2>
    <div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addTicketModal">
            <i class="bi bi-plus-circle"></i> New Ticket
        </button>
    </div>
</div>

<!-- Help Tickets Table -->
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Support Tickets</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Ticket ID</th>
                        <th>Subject</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Reported By</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="helpTableBody">
                    <tr>
                        <td colspan="7" class="text-center">Loading help tickets...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Help Ticket Modal -->
<div class="modal fade" id="addTicketModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Help Ticket</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="helpForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Ticket ID *</label>
                            <input type="text" class="form-control" name="ticket_id" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" name="category">
                                <option value="Hardware">Hardware</option>
                                <option value="Software">Software</option>
                                <option value="Network">Network</option>
                                <option value="Account">Account</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Subject *</label>
                        <input type="text" class="form-control" name="subject" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Priority</label>
                            <select class="form-select" name="priority">
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="Open">Open</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Resolved">Resolved</option>
                                <option value="Closed">Closed</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Reported By</label>
                            <input type="text" class="form-control" name="reported_by">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Assigned To</label>
                            <input type="text" class="form-control" name="assigned_to">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveHelpTicket()">Save Ticket</button>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadHelpTickets() {
        const tickets = await apiCall('/api/help/tickets');
        
        if (tickets.success !== false) {
            renderHelpTable(tickets);
        } else {
            document.getElementById('helpTableBody').innerHTML = 
                '<tr><td colspan="7" class="text-center text-danger">Failed to load help tickets</td></tr>';
        }
    }

    function renderHelpTable(tickets) {
        const tbody = document.getElementById('helpTableBody');
        
        if (tickets.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">No help tickets found</td></tr>';
            return;
        }
        
        tbody.innerHTML = tickets.map(ticket => `
            <tr>
                <td><strong>${ticket.ticket_id}</strong></td>
                <td>${ticket.subject}</td>
                <td>${ticket.category}</td>
                <td><span class="badge bg-${getPriorityColor(ticket.priority)}">${ticket.priority}</span></td>
                <td>${ticket.reported_by}</td>
                <td><span class="badge bg-${ticket.status === 'Resolved' ? 'success' : 'warning'}">${ticket.status}</span></td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="editHelpTicket(${ticket.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteHelpTicket(${ticket.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function getPriorityColor(priority) {
        const colors = {
            'Low': 'secondary',
            'Medium': 'info',
            'High': 'warning'
        };
        return colors[priority] || 'secondary';
    }

    async function saveHelpTicket() {
        const form = document.getElementById('helpForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        const result = await apiCall('/api/help/tickets', 'POST', data);
        
        if (result.success) {
            showNotification('Help ticket added successfully');
            $('#addTicketModal').modal('hide');
            form.reset();
            loadHelpTickets();
        } else {
            showNotification('Failed to add ticket: ' + result.error, 'danger');
        }
    }

    document.addEventListener('DOMContentLoaded', loadHelpTickets);
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>HR Management</h2>
    <div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addEmployeeModal">
            <i class="bi bi-person-plus"></i> Add Employee
        </button>
        <button class="btn btn-outline-secondary ms-2" onclick="exportEmployees()">
            <i class="bi bi-download"></i> Export
        </button>
    </div>
</div>

<!-- Employee Table -->
<div class="card">
    <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Employee Directory</h5>
            <input type="text" class="form-control form-control-sm" style="width: 300px;" 
                   placeholder="Search employees..." id="employeeSearch" onkeyup="searchEmployees()">
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Full Name</th>
                        <th>Department</th>
                        <th>Designation</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <tr>
                        <td colspan="7" class="text-center">Loading employees...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Employee Modal -->
<div class="modal fade" id="addEmployeeModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Employee</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="employeeForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Employee ID *</label>
                            <input type="text" class="form-control" name="employee_id" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name *</label>
                            <input type="text" class="form-control" name="full_name" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Department *</label>
                            <input type="text" class="form-control" name="department" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Designation *</label>
                            <input type="text" class="form-control" name="designation" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Joining Date</label>
                            <input type="date" class="form-control" name="joining_date">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Salary</label>
                            <input type="number" class="form-control" name="salary" step="0.01">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                                <option value="On Leave">On Leave</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Skills</label>
                            <input type="text" class="form-control" name="skills">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" name="address" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveEmployee()">Save Employee</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Load employees on page load
    async function loadEmployees() {
        const employees = await apiCall('/api/hr/employees');
        
        if (employees.success !== false) {
            renderEmployeeTable(employees);
        } else {
            document.getElementById('employeeTableBody').innerHTML = 
                '<tr><td colspan="7" class="text-center text-danger">Failed to load employees</td></tr>';
        }
    }

    function renderEmployeeTable(employees) {
        const tbody = document.getElementById('employeeTableBody');
        
        if (employees.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">No employees found</td></tr>';
            return;
        }
        
        tbody.innerHTML = employees.map(employee => `
            <tr>
                <td><strong>${employee.employee_id}</strong></td>
                <td>${employee.full_name}</td>
                <td>${employee.department}</td>
                <td>${employee.designation}</td>
                <td>${employee.email}</td>
                <td><span class="badge bg-${employee.status === 'Active' ? 'success' : 'secondary'}">${employee.status}</span></td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="editEmployee(${employee.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteEmployee(${employee.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    async function saveEmployee() {
        const form = document.getElementById('employeeForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        const result = await apiCall('/api/hr/employees', 'POST', data);
        
        if (result.success) {
            showNotification('Employee added successfully');
            $('#addEmployeeModal').modal('hide');
            form.reset();
            loadEmployees();
        } else {
            showNotification('Failed to add employee: ' + result.error, 'danger');
        }
    }

    async function deleteEmployee(employeeId) {
        if (!confirm('Are you sure you want to delete this employee?')) {
            return;
        }
        
        const result = await apiCall(`/api/hr/employees/${employeeId}`, 'DELETE');
        
        if (result.success) {
            showNotification('Employee deleted successfully');
            loadEmployees();
        } else {
            showNotification('Failed to delete employee: ' + result.error, 'danger');
        }
    }

    function searchEmployees() {
        const searchTerm = document.getElementById('employeeSearch').value.toLowerCase();
        const rows = document.querySelectorAll('#employeeTableBody tr');
        
        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(searchTerm) ? '' : 'none';
        });
    }

    function exportEmployees() {
        showNotification('Export functionality coming soon');
    }

    // Load employees on page load
    document.addEventListener('DOMContentLoaded', loadEmployees);
</script>
{% endblock %}

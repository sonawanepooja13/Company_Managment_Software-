{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Price List Management</h2>
    <div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addPriceModal">
            <i class="bi bi-plus-circle"></i> Add Price
        </button>
    </div>
</div>

<!-- Price List Table -->
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Product Price List</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Product Name</th>
                        <th>Product Code</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Effective Date</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="priceTableBody">
                    <tr>
                        <td colspan="7" class="text-center">Loading price list...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Price Modal -->
<div class="modal fade" id="addPriceModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Price</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="priceForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Product Name *</label>
                            <input type="text" class="form-control" name="product_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Product Code</label>
                            <input type="text" class="form-control" name="product_code">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" class="form-control" name="category">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Price *</label>
                            <input type="number" class="form-control" name="price" step="0.01" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Effective Date</label>
                            <input type="date" class="form-control" name="effective_date">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Expiry Date</label>
                            <input type="date" class="form-control" name="expiry_date">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="savePrice()">Save Price</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Load price list on page load
    async function loadPriceList() {
        const prices = await apiCall('/api/pricing');
        
        if (prices.success !== false) {
            renderPriceTable(prices);
        } else {
            document.getElementById('priceTableBody').innerHTML = 
                '<tr><td colspan="7" class="text-center text-danger">Failed to load price list</td></tr>';
        }
    }

    function renderPriceTable(prices) {
        const tbody = document.getElementById('priceTableBody');
        
        if (prices.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">No prices found</td></tr>';
            return;
        }
        
        tbody.innerHTML = prices.map(price => `
            <tr>
                <td><strong>${price.product_name}</strong></td>
                <td>${price.product_code}</td>
                <td>${price.category}</td>
                <td>₹${price.price}</td>
                <td>${price.effective_date}</td>
                <td><span class="badge bg-success">Active</span></td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="editPrice(${price.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deletePrice(${price.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    async function savePrice() {
        const form = document.getElementById('priceForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        const result = await apiCall('/api/pricing', 'POST', data);
        
        if (result.success) {
            showNotification('Price added successfully');
            $('#addPriceModal').modal('hide');
            form.reset();
            loadPriceList();
        } else {
            showNotification('Failed to add price: ' + result.error, 'danger');
        }
    }

    // Load price list on page load
    document.addEventListener('DOMContentLoaded', loadPriceList);
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Materials Management</h2>
    <div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addMaterialModal">
            <i class="bi bi-plus-circle"></i> Add Material
        </button>
    </div>
</div>

<!-- Materials Table -->
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Material Inventory</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Material Name</th>
                        <th>Code</th>
                        <th>Category</th>
                        <th>Supplier</th>
                        <th>Unit Price</th>
                        <th>Stock</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="materialTableBody">
                    <tr>
                        <td colspan="7" class="text-center">Loading materials...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Material Modal -->
<div class="modal fade" id="addMaterialModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Material</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="materialForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Material Name *</label>
                            <input type="text" class="form-control" name="material_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Material Code</label>
                            <input type="text" class="form-control" name="material_code">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" class="form-control" name="category">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Supplier</label>
                            <input type="text" class="form-control" name="supplier">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Unit Price</label>
                            <input type="number" class="form-control" name="unit_price" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Unit</label>
                            <input type="text" class="form-control" name="unit">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Stock Quantity</label>
                            <input type="number" class="form-control" name="stock_quantity">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Minimum Stock</label>
                            <input type="number" class="form-control" name="minimum_stock">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveMaterial()">Save Material</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Load materials on page load
    async function loadMaterials() {
        const materials = await apiCall('/api/materials');
        
        if (materials.success !== false) {
            renderMaterialTable(materials);
        } else {
            document.getElementById('materialTableBody').innerHTML = 
                '<tr><td colspan="7" class="text-center text-danger">Failed to load materials</td></tr>';
        }
    }

    function renderMaterialTable(materials) {
        const tbody = document.getElementById('materialTableBody');
        
        if (materials.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">No materials found</td></tr>';
            return;
        }
        
        tbody.innerHTML = materials.map(material => `
            <tr>
                <td><strong>${material.material_name}</strong></td>
                <td>${material.material_code}</td>
                <td>${material.category}</td>
                <td>${material.supplier}</td>
                <td>₹${material.unit_price}</td>
                <td><span class="badge bg-${material.stock_quantity > material.minimum_stock ? 'success' : 'warning'}">${material.stock_quantity}</span></td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="editMaterial(${material.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteMaterial(${material.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    async function saveMaterial() {
        const form = document.getElementById('materialForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        const result = await apiCall('/api/materials', 'POST', data);
        
        if (result.success) {
            showNotification('Material added successfully');
            $('#addMaterialModal').modal('hide');
            form.reset();
            loadMaterials();
        } else {
            showNotification('Failed to add material: ' + result.error, 'danger');
        }
    }

    // Load materials on page load
    document.addEventListener('DOMContentLoaded', loadMaterials);
</script>
{% endblock %}

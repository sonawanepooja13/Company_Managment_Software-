{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Supply Chain & Logistics</h2>
    <div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addSupplierModal">
            <i class="bi bi-plus-circle"></i> Add Supplier
        </button>
    </div>
</div>

<!-- Suppliers Table -->
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Supplier Directory</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Supplier Name</th>
                        <th>Code</th>
                        <th>Contact Person</th>
                        <th>Phone</th>
                        <th>Category</th>
                        <th>Rating</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="supplierTableBody">
                    <tr>
                        <td colspan="8" class="text-center">Loading suppliers...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Supplier Modal -->
<div class="modal fade" id="addSupplierModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Supplier</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="supplierForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Supplier Name *</label>
                            <input type="text" class="form-control" name="supplier_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Supplier Code</label>
                            <input type="text" class="form-control" name="supplier_code">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Contact Person</label>
                            <input type="text" class="form-control" name="contact_person">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone</label>
                            <input type="text" class="form-control" name="phone">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" name="email">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" class="form-control" name="category">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Rating</label>
                            <input type="number" class="form-control" name="rating" step="0.1" min="0" max="5">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea class="form-control" name="address" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveSupplier()">Save Supplier</button>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadSuppliers() {
        const suppliers = await apiCall('/api/supply-chain');
        
        if (suppliers.success !== false) {
            renderSupplierTable(suppliers);
        } else {
            document.getElementById('supplierTableBody').innerHTML = 
                '<tr><td colspan="8" class="text-center text-danger">Failed to load suppliers</td></tr>';
        }
    }

    function renderSupplierTable(suppliers) {
        const tbody = document.getElementById('supplierTableBody');
        
        if (suppliers.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">No suppliers found</td></tr>';
            return;
        }
        
        tbody.innerHTML = suppliers.map(supplier => `
            <tr>
                <td><strong>${supplier.supplier_name}</strong></td>
                <td>${supplier.supplier_code}</td>
                <td>${supplier.contact_person}</td>
                <td>${supplier.phone}</td>
                <td>${supplier.category}</td>
                <td><span class="badge bg-warning">${supplier.rating}</span></td>
                <td><span class="badge bg-${supplier.status === 'Active' ? 'success' : 'secondary'}">${supplier.status}</span></td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="editSupplier(${supplier.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteSupplier(${supplier.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    async function saveSupplier() {
        const form = document.getElementById('supplierForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        const result = await apiCall('/api/supply-chain', 'POST', data);
        
        if (result.success) {
            showNotification('Supplier added successfully');
            $('#addSupplierModal').modal('hide');
            form.reset();
            loadSuppliers();
        } else {
            showNotification('Failed to add supplier: ' + result.error, 'danger');
        }
    }

    document.addEventListener('DOMContentLoaded', loadSuppliers);
</script>
{% endblock %}

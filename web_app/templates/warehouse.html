{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Warehouse Management</h2>
    <div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addItemModal">
            <i class="bi bi-plus-circle"></i> Add Item
        </button>
        <button class="btn btn-outline-secondary ms-2" onclick="exportWarehouse()">
            <i class="bi bi-download"></i> Export
        </button>
    </div>
</div>

<!-- Warehouse Items Table -->
<div class="card">
    <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
            <h5 class="mb-0">Warehouse Inventory</h5>
            <input type="text" class="form-control form-control-sm" style="width: 300px;" 
                   placeholder="Search items..." id="itemSearch" onkeyup="searchItems()">
        </div>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Item Code</th>
                        <th>Category</th>
                        <th>Quantity</th>
                        <th>Location</th>
                        <th>Supplier</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="warehouseTableBody">
                    <tr>
                        <td colspan="7" class="text-center">Loading warehouse items...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Item Modal -->
<div class="modal fade" id="addItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Warehouse Item</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="warehouseForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Item Name *</label>
                            <input type="text" class="form-control" name="item_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Item Code</label>
                            <input type="text" class="form-control" name="item_code">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" class="form-control" name="category">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Quantity *</label>
                            <input type="number" class="form-control" name="quantity" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Location</label>
                            <input type="text" class="form-control" name="location">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Supplier</label>
                            <input type="text" class="form-control" name="supplier">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Unit Price</label>
                            <input type="number" class="form-control" name="unit_price" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Last Restocked</label>
                            <input type="date" class="form-control" name="last_restocked">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveWarehouseItem()">Save Item</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Load warehouse items on page load
    async function loadWarehouseItems() {
        const items = await apiCall('/api/warehouse/items');
        
        if (items.success !== false) {
            renderWarehouseTable(items);
        } else {
            document.getElementById('warehouseTableBody').innerHTML = 
                '<tr><td colspan="7" class="text-center text-danger">Failed to load warehouse items</td></tr>';
        }
    }

    function renderWarehouseTable(items) {
        const tbody = document.getElementById('warehouseTableBody');
        
        if (items.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">No warehouse items found</td></tr>';
            return;
        }
        
        tbody.innerHTML = items.map(item => `
            <tr>
                <td><strong>${item.item_name}</strong></td>
                <td>${item.item_code}</td>
                <td>${item.category}</td>
                <td><span class="badge bg-${item.quantity > 10 ? 'success' : 'warning'}">${item.quantity}</span></td>
                <td>${item.location}</td>
                <td>${item.supplier}</td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="editWarehouseItem(${item.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteWarehouseItem(${item.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    async function saveWarehouseItem() {
        const form = document.getElementById('warehouseForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        const result = await apiCall('/api/warehouse/items', 'POST', data);
        
        if (result.success) {
            showNotification('Warehouse item added successfully');
            $('#addItemModal').modal('hide');
            form.reset();
            loadWarehouseItems();
        } else {
            showNotification('Failed to add item: ' + result.error, 'danger');
        }
    }

    async function deleteWarehouseItem(itemId) {
        if (!confirm('Are you sure you want to delete this item?')) {
            return;
        }
        
        const result = await apiCall(`/api/warehouse/items/${itemId}`, 'DELETE');
        
        if (result.success) {
            showNotification('Item deleted successfully');
            loadWarehouseItems();
        } else {
            showNotification('Failed to delete item: ' + result.error, 'danger');
        }
    }

    function searchItems() {
        const searchTerm = document.getElementById('itemSearch').value.toLowerCase();
        const rows = document.querySelectorAll('#warehouseTableBody tr');
        
        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(searchTerm) ? '' : 'none';
        });
    }

    function exportWarehouse() {
        showNotification('Export functionality coming soon');
    }

    // Load warehouse items on page load
    document.addEventListener('DOMContentLoaded', loadWarehouseItems);
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Project Management</h2>
    <div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addProjectModal">
            <i class="bi bi-plus-circle"></i> New Project
        </button>
    </div>
</div>

<!-- Projects Table -->
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Active Projects</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Project Name</th>
                        <th>Client</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Budget</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="projectTableBody">
                    <tr>
                        <td colspan="7" class="text-center">Loading projects...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Project Modal -->
<div class="modal fade" id="addProjectModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Project</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="projectForm">
                    <div class="mb-3">
                        <label class="form-label">Project Name *</label>
                        <input type="text" class="form-control" name="project_name" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Project Code</label>
                            <input type="text" class="form-control" name="project_code">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Client Name</label>
                            <input type="text" class="form-control" name="client_name">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" class="form-control" name="start_date">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">End Date</label>
                            <input type="date" class="form-control" name="end_date">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Budget</label>
                            <input type="number" class="form-control" name="budget" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="Planning">Planning</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                                <option value="On Hold">On Hold</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveProject()">Save Project</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Load projects on page load
    async function loadProjects() {
        const projects = await apiCall('/api/projects');
        
        if (projects.success !== false) {
            renderProjectTable(projects);
        } else {
            document.getElementById('projectTableBody').innerHTML = 
                '<tr><td colspan="7" class="text-center text-danger">Failed to load projects</td></tr>';
        }
    }

    function renderProjectTable(projects) {
        const tbody = document.getElementById('projectTableBody');
        
        if (projects.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center">No projects found</td></tr>';
            return;
        }
        
        tbody.innerHTML = projects.map(project => `
            <tr>
                <td><strong>${project.project_name}</strong></td>
                <td>${project.client_name}</td>
                <td>${project.start_date}</td>
                <td>${project.end_date}</td>
                <td>₹${project.budget}</td>
                <td><span class="badge bg-${getProjectStatusColor(project.status)}">${project.status}</span></td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="editProject(${project.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteProject(${project.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function getProjectStatusColor(status) {
        const colors = {
            'Planning': 'secondary',
            'In Progress': 'primary',
            'Completed': 'success',
            'On Hold': 'warning'
        };
        return colors[status] || 'secondary';
    }

    async function saveProject() {
        const form = document.getElementById('projectForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        const result = await apiCall('/api/projects', 'POST', data);
        
        if (result.success) {
            showNotification('Project added successfully');
            $('#addProjectModal').modal('hide');
            form.reset();
            loadProjects();
        } else {
            showNotification('Failed to add project: ' + result.error, 'danger');
        }
    }

    async function deleteProject(projectId) {
        if (!confirm('Are you sure you want to delete this project?')) {
            return;
        }
        
        const result = await apiCall(`/api/projects/${projectId}`, 'DELETE');
        
        if (result.success) {
            showNotification('Project deleted successfully');
            loadProjects();
        } else {
            showNotification('Failed to delete project: ' + result.error, 'danger');
        }
    }

    // Load projects on page load
    document.addEventListener('DOMContentLoaded', loadProjects);
</script>
{% endblock %}

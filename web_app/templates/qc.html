{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>QC/QA Management</h2>
    <div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addRecordModal">
            <i class="bi bi-plus-circle"></i> Add QC Record
        </button>
    </div>
</div>

<!-- QC Records Table -->
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Quality Control Records</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Record ID</th>
                        <th>Product ID</th>
                        <th>Batch</th>
                        <th>Inspection Date</th>
                        <th>Inspector</th>
                        <th>Result</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="qcTableBody">
                    <tr>
                        <td colspan="8" class="text-center">Loading QC records...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add QC Record Modal -->
<div class="modal fade" id="addRecordModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add QC Record</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="qcForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Record ID *</label>
                            <input type="text" class="form-control" name="record_id" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Product ID *</label>
                            <input type="text" class="form-control" name="product_id" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Batch ID</label>
                            <input type="number" class="form-control" name="batch_id">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Inspection Date</label>
                            <input type="date" class="form-control" name="inspection_date">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Inspector</label>
                            <input type="text" class="form-control" name="inspector">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Result</label>
                            <select class="form-select" name="result">
                                <option value="Pass">Pass</option>
                                <option value="Fail">Fail</option>
                                <option value="Conditional">Conditional</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Quality Parameters</label>
                        <textarea class="form-control" name="quality_parameters" rows="2"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Defects</label>
                        <textarea class="form-control" name="defects" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveQcRecord()">Save Record</button>
            </div>
        </div>
    </div>
</div>

<script>
    async function loadQcRecords() {
        const records = await apiCall('/api/qc/records');
        
        if (records.success !== false) {
            renderQcTable(records);
        } else {
            document.getElementById('qcTableBody').innerHTML = 
                '<tr><td colspan="8" class="text-center text-danger">Failed to load QC records</td></tr>';
        }
    }

    function renderQcTable(records) {
        const tbody = document.getElementById('qcTableBody');
        
        if (records.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" class="text-center">No QC records found</td></tr>';
            return;
        }
        
        tbody.innerHTML = records.map(record => `
            <tr>
                <td><strong>${record.record_id}</strong></td>
                <td>${record.product_id}</td>
                <td>${record.batch_id}</td>
                <td>${record.inspection_date}</td>
                <td>${record.inspector}</td>
                <td><span class="badge bg-${record.result === 'Pass' ? 'success' : 'danger'}">${record.result}</span></td>
                <td><span class="badge bg-${record.status === 'Completed' ? 'success' : 'warning'}">${record.status}</span></td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="editQcRecord(${record.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteQcRecord(${record.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    async function saveQcRecord() {
        const form = document.getElementById('qcForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        const result = await apiCall('/api/qc/records', 'POST', data);
        
        if (result.success) {
            showNotification('QC record added successfully');
            $('#addRecordModal').modal('hide');
            form.reset();
            loadQcRecords();
        } else {
            showNotification('Failed to add record: ' + result.error, 'danger');
        }
    }

    document.addEventListener('DOMContentLoaded', loadQcRecords);
</script>
{% endblock %}

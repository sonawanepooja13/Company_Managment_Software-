{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Finance Management</h2>
    <div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addAccountModal">
            <i class="bi bi-plus-circle"></i> Add Account
        </button>
        <button class="btn btn-primary ms-2" data-bs-toggle="modal" data-bs-target="#addTransactionModal">
            <i class="bi bi-currency-rupee"></i> Add Transaction
        </button>
    </div>
</div>

<!-- Accounts Section -->
<div class="row mb-4">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Accounts</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Account Name</th>
                                <th>Account Type</th>
                                <th>Account Number</th>
                                <th>Bank</th>
                                <th>Balance</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="accountTableBody">
                            <tr>
                                <td colspan="6" class="text-center">Loading accounts...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Transactions Section -->
<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Recent Transactions</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Transaction ID</th>
                                <th>Date</th>
                                <th>Type</th>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Description</th>
                            </tr>
                        </thead>
                        <tbody id="transactionTableBody">
                            <tr>
                                <td colspan="6" class="text-center">Loading transactions...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Account Modal -->
<div class="modal fade" id="addAccountModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="accountForm">
                    <div class="mb-3">
                        <label class="form-label">Account Name *</label>
                        <input type="text" class="form-control" name="account_name" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Account Type</label>
                            <select class="form-select" name="account_type">
                                <option value="Savings">Savings</option>
                                <option value="Current">Current</option>
                                <option value="Cash">Cash</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Account Number</label>
                            <input type="text" class="form-control" name="account_number">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Balance</label>
                            <input type="number" class="form-control" name="balance" step="0.01">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Bank Name</label>
                            <input type="text" class="form-control" name="bank_name">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveAccount()">Save Account</button>
            </div>
        </div>
    </div>
</div>

<!-- Add Transaction Modal -->
<div class="modal fade" id="addTransactionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Transaction</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="transactionForm">
                    <div class="mb-3">
                        <label class="form-label">Transaction ID *</label>
                        <input type="text" class="form-control" name="transaction_id" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" name="date">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Type</label>
                            <select class="form-select" name="type">
                                <option value="Credit">Credit</option>
                                <option value="Debit">Debit</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" class="form-control" name="category">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Amount *</label>
                            <input type="number" class="form-control" name="amount" step="0.01" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" name="description" rows="2"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveTransaction()">Save Transaction</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Load accounts on page load
    async function loadAccounts() {
        const accounts = await apiCall('/api/finance/accounts');
        
        if (accounts.success !== false) {
            renderAccountTable(accounts);
        } else {
            document.getElementById('accountTableBody').innerHTML = 
                '<tr><td colspan="6" class="text-center text-danger">Failed to load accounts</td></tr>';
        }
    }

    function renderAccountTable(accounts) {
        const tbody = document.getElementById('accountTableBody');
        
        if (accounts.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center">No accounts found</td></tr>';
            return;
        }
        
        tbody.innerHTML = accounts.map(account => `
            <tr>
                <td><strong>${account.account_name}</strong></td>
                <td>${account.account_type}</td>
                <td>${account.account_number}</td>
                <td>${account.bank_name}</td>
                <td>₹${account.balance}</td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="editAccount(${account.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteAccount(${account.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    // Load transactions on page load
    async function loadTransactions() {
        const transactions = await apiCall('/api/finance/transactions');
        
        if (transactions.success !== false) {
            renderTransactionTable(transactions);
        } else {
            document.getElementById('transactionTableBody').innerHTML = 
                '<tr><td colspan="6" class="text-center text-danger">Failed to load transactions</td></tr>';
        }
    }

    function renderTransactionTable(transactions) {
        const tbody = document.getElementById('transactionTableBody');
        
        if (transactions.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center">No transactions found</td></tr>';
            return;
        }
        
        tbody.innerHTML = transactions.map(transaction => `
            <tr>
                <td>${transaction.transaction_id}</td>
                <td>${transaction.date}</td>
                <td><span class="badge bg-${transaction.type === 'Credit' ? 'success' : 'danger'}">${transaction.type}</span></td>
                <td>${transaction.category}</td>
                <td>₹${transaction.amount}</td>
                <td>${transaction.description}</td>
            </tr>
        `).join('');
    }

    async function saveAccount() {
        const form = document.getElementById('accountForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        const result = await apiCall('/api/finance/accounts', 'POST', data);
        
        if (result.success) {
            showNotification('Account added successfully');
            $('#addAccountModal').modal('hide');
            form.reset();
            loadAccounts();
        } else {
            showNotification('Failed to add account: ' + result.error, 'danger');
        }
    }

    async function saveTransaction() {
        const form = document.getElementById('transactionForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        const result = await apiCall('/api/finance/transactions', 'POST', data);
        
        if (result.success) {
            showNotification('Transaction added successfully');
            $('#addTransactionModal').modal('hide');
            form.reset();
            loadTransactions();
        } else {
            showNotification('Failed to add transaction: ' + result.error, 'danger');
        }
    }

    // Load data on page load
    document.addEventListener('DOMContentLoaded', function() {
        loadAccounts();
        loadTransactions();
    });
</script>
{% endblock %}

{% extends "base.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Production Management</h2>
    <div>
        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addBatchModal">
            <i class="bi bi-plus-circle"></i> New Batch
        </button>
        <button class="btn btn-outline-secondary ms-2" onclick="exportProduction()">
            <i class="bi bi-download"></i> Export
        </button>
    </div>
</div>

<!-- Production Batches Table -->
<div class="card">
    <div class="card-header">
        <h5 class="mb-0">Production Batches</h5>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Batch Number</th>
                        <th>Product Name</th>
                        <th>Start Date</th>
                        <th>Expected Completion</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="batchTableBody">
                    <tr>
                        <td colspan="6" class="text-center">Loading batches...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add Batch Modal -->
<div class="modal fade" id="addBatchModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Production Batch</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="batchForm">
                    <div class="mb-3">
                        <label class="form-label">Batch Number *</label>
                        <input type="text" class="form-control" name="batch_number" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Product Name *</label>
                        <input type="text" class="form-control" name="product_name" required>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Start Date</label>
                            <input type="date" class="form-control" name="start_date">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Expected Completion</label>
                            <input type="date" class="form-control" name="expected_completion_date">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Assigned Personnel</label>
                        <input type="text" class="form-control" name="assigned_personnel">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Quantity</label>
                            <input type="number" class="form-control" name="quantity">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <select class="form-select" name="status">
                                <option value="Pending">Pending</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Completed">Completed</option>
                                <option value="Cancelled">Cancelled</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="saveBatch()">Save Batch</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Load production batches on page load
    async function loadBatches() {
        const batches = await apiCall('/api/production/batches');
        
        if (batches.success !== false) {
            renderBatchTable(batches);
        } else {
            document.getElementById('batchTableBody').innerHTML = 
                '<tr><td colspan="6" class="text-center text-danger">Failed to load batches</td></tr>';
        }
    }

    function renderBatchTable(batches) {
        const tbody = document.getElementById('batchTableBody');
        
        if (batches.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="text-center">No production batches found</td></tr>';
            return;
        }
        
        tbody.innerHTML = batches.map(batch => `
            <tr>
                <td><strong>${batch.batch_number}</strong></td>
                <td>${batch.product_name}</td>
                <td>${batch.start_date}</td>
                <td>${batch.expected_completion_date}</td>
                <td><span class="badge bg-${getStatusColor(batch.status)}">${batch.status}</span></td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="editBatch(${batch.id})">
                        <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteBatch(${batch.id})">
                        <i class="bi bi-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function getStatusColor(status) {
        const colors = {
            'In Progress': 'primary',
            'Completed': 'success',
            'Pending': 'warning',
            'Cancelled': 'danger'
        };
        return colors[status] || 'secondary';
    }

    async function saveBatch() {
        const form = document.getElementById('batchForm');
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        const result = await apiCall('/api/production/batches', 'POST', data);
        
        if (result.success) {
            showNotification('Production batch added successfully');
            $('#addBatchModal').modal('hide');
            form.reset();
            loadBatches();
        } else {
            showNotification('Failed to add batch: ' + result.error, 'danger');
        }
    }

    async function deleteBatch(batchId) {
        if (!confirm('Are you sure you want to delete this batch?')) {
            return;
        }
        
        const result = await apiCall(`/api/production/batches/${batchId}`, 'DELETE');
        
        if (result.success) {
            showNotification('Batch deleted successfully');
            loadBatches();
        } else {
            showNotification('Failed to delete batch: ' + result.error, 'danger');
        }
    }

    function exportProduction() {
        window.location.href = '/api/export/production';
    }

    // Load batches on page load
    document.addEventListener('DOMContentLoaded', loadBatches);
</script>
{% endblock %}
